# Public test input matching the production server block recorded 2026-10-13.
# No credentials or certificate material. The Python harness strips the TLS
# marker and substitutes all roots before launching its private loopback nginx.
server {
 server_name cats-pajamas.ru www.cats-pajamas.ru 31.77.151.27;
 root /opt/cats-pajamas-club/dist_current;
 index index.html;
 client_max_body_size 16m;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /game { return 301 /game/; }
 location ^~ /game/ { alias /opt/bartender-sim/dist/; index index.html; }
 location = /health { proxy_pass http://127.0.0.1:3001; }
 location ^~ /api/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location ^~ /uploads/events/ { alias /opt/cats-pajamas-uploads/events/; expires 7d; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location ~ /index\.html$ { add_header Cache-Control "no-cache"; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    listen 443 ssl; # parser marker only; no real TLS configuration is used
}
